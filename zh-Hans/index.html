<p>记录爱车的每一笔花费，自动算出每日成本、平均油价和油耗。数据先存在你的手机，没有账号、没有广告、不追踪。</p>
<h2>功能</h2>
<ul><li>加油、洗车、用品、保养、保险，全部记在同一本账</li><li>每日平均、平均油价、平均油耗（全部平均与最近两次）</li><li>油价走势和每月花费图表</li><li>多辆车、km／L／mpg 等单位和 18 种币别</li><li>多辆车与同步（iCloud、Google 表格），全部免费</li></ul>
