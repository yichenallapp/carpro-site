<p>記錄愛車的每一筆花費，自動算出每日成本、平均油價與油耗。資料先存在你的手機，沒有帳號、沒有廣告、不追蹤。</p>
<h2>功能</h2>
<ul><li>加油、洗車、用品、保養、保險，全部記在同一本帳</li><li>每日平均、平均油價、平均油耗（全部平均與最近兩次）</li><li>油價走勢與每月花費圖表</li><li>多台車、km／L／mpg 等單位與 18 種幣別</li><li>多台車與同步（iCloud、Google 試算表）為 Pro，一次購買、永久使用</li></ul>
